name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    name: ${{ matrix.preset }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        preset: [debug, asan, tsan]
    container:
      image: ubuntu:24.04
      # TSan needs ASLR off on 6.x kernels (setarch -R), which needs personality().
      options: --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 util-linux libsqlite3-dev libgtest-dev libgmock-dev nlohmann-json3-dev
      - name: Build
        run: cmake --preset ${{ matrix.preset }} && cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: setarch -R ctest --preset ${{ matrix.preset }}

  fuzz-smoke:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang libclang-rt-18-dev cmake ninja-build libsqlite3-dev nlohmann-json3-dev
      - name: Build fuzzers
        run: cmake --preset clang-fuzz && cmake --build --preset clang-fuzz
      - name: Fuzz each target for 60 s
        run: |
          for f in json_event config kmsg procfs netlink dns; do
            build/clang-fuzz/tests/fuzz/fuzz_$f -max_total_time=60 -print_final_stats=1 tests/fuzz/corpus/$f
          done

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck lab/run_lab.sh scripts/*.sh tests/integration/scenarios.sh
