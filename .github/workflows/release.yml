name: release
# On a v* tag: build, test and package amd64 and arm64 .debs on the oldest
# supported glibc, install-test them in clean containers and on fresh VMs
# (package.yml), then publish a GitHub Release with the .debs, install.sh
# and SHA256SUMS covering all of them.
# No untrusted event text reaches a run: line; the tag name is read from the
# GITHUB_REF_NAME environment variable (only collaborators can push tags).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      check_tag: true

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp install.sh dist/
          cd dist && sha256sum ./*.deb install.sh | sed 's# \./# #' > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CHANGELOG section for this tag, up to the next version heading.
          notes="$(awk -v v="[${GITHUB_REF_NAME#v}]" '/^## \[/{p = index($0, v) > 0} p' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/install.sh dist/SHA256SUMS \
            --title "Hostmortem $GITHUB_REF_NAME" --notes "$notes"
